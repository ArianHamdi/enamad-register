services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: enamad-site
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # generated by ./prod.sh
      - ./site:/srv:ro                        # generated by ./prod.sh
      - ./logs:/var/log/caddy                 # request log lands here
      - caddy_data:/data                      # certificates + ACME account
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/", "--header", "Host: ${DOMAIN}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
